[package]

name = "rays"
version = "0.0.1"
edition = "2024"

[dependencies]
image = "0.25.5"
nalgebra = "0.33.2"
rand = "0.6"
clap = { version = "4.5.32", features = ["derive"] }
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
lazy_static = "1.2.0"
rayon="1.0"
tobj = "4.0.3"
ordered-float = "5.0.0"
num-complex = "0.4.6"
rustfft="2.1"
termcolor="1.0.5"
indicatif = "0.17.11"
console = "0.15.11"
approx = "0.5.1"
nv-flip = "0.1.2"
libc = "0.2"

[profile.release]
# Whole-program optimisation: inlining across crates (nalgebra, rustfft, rand) and modules.
# Measured on an M2: ocean-boat 27.5 s -> 15.6 s, other scenes about 4% faster. Thin LTO, or
# one codegen unit without LTO, gave nothing. The cost is slower release rebuilds (about 65 s
# after touching one file, from about 20 s).
lto = "fat"
codegen-units = 1
