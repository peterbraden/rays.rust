[package]

name = "rays"
version = "0.0.1"
edition = "2024"

[dependencies]
# Only the formats used: PNG and EXR output, and common formats for heightmap images. The
# default set includes an AVIF encoder, which is large and does not run in a plain WebAssembly
# module.
image = { version = "0.25.5", default-features = false, features = ["png", "exr", "jpeg", "bmp", "tga", "tiff", "hdr"] }
# Written directly, rather than through `image`, to fix the order of an EXR file's blocks.
exr = "1.73"
nalgebra = "0.35.0"
# Seeded generators only (`StdRng::seed_from_u64`): without rand's default `sys_rng`, whose
# getrandom has no browser backend by default.
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }
rand_distr = "0.6"
clap = { version = "4.5.32", features = ["derive"], optional = true }
serde = "1.0"
serde_derive = "1.0"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
lazy_static = "1.2.0"
rayon="1.0"
# Without `ahash`, whose getrandom has no browser backend by default.
tobj = { version = "4.0.3", default-features = false }
ordered-float = "5.0.0"
num-complex = "0.4.6"
rustfft = "6.4"
termcolor="1.0.5"
indicatif = { version = "0.18.6", optional = true }
console = { version = "0.16.6", optional = true }
approx = "0.5.1"
# C++, so not in the browser's build: `--compare` (src/compare.rs) is the command line's.
nv-flip = { version = "0.1.2", optional = true }
ttf-parser = "0.25"
libc = { version = "0.2", optional = true }
# The HTTP side of `rays serve`.
tiny_http = { version = "0.12", optional = true }
# std's Instant natively; performance.now() in a browser, where std's panics.
web-time = "1.1"
# The GPU path tracer (`gpu`), built only with `--features gpu`.
wgpu = { version = "30", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
# The shader crate, also compiled for the CPU: its buffer layouts and its code, for tests.
pathtrace = { path = "shaders/pathtrace", optional = true }

# Natively the shader goes in as SPIR-V; a browser takes its WGSL (src/gpu/pathtrace.wgsl).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30", optional = true, features = ["spirv"] }

[lib]
name = "rays"
path = "src/lib.rs"

# The command-line tool. The library alone (without `cli`) is what the browser's build uses.
[[bin]]
name = "rays"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:indicatif", "dep:console", "dep:nv-flip", "dep:libc", "dep:tiny_http"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:pathtrace"]

[profile.release]
# Whole-program optimisation: inlining across crates (nalgebra, rustfft, rand) and modules.
# Measured on an M2: ocean-boat 27.5 s -> 15.6 s, other scenes about 4% faster. Thin LTO, or
# one codegen unit without LTO, gave nothing. The cost is slower release rebuilds (about 65 s
# after touching one file, from about 20 s).
lto = "fat"
codegen-units = 1
