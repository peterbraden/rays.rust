name: Build, Tests, Lint and Examples

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Unoptimised, the test suite's renders and sky integrations took 47 minutes.
  # Optimise the dev/test profile in CI, keeping debug assertions and overflow
  # checks, and drop debug info (it only slows linking and bloats the cache).
  CARGO_PROFILE_DEV_OPT_LEVEL: 2
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - name: Install Clippy
      run: rustup component add clippy
    - name: Run Clippy
      run: cargo clippy -- -D errors

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - name: Build tests
      run: cargo test --no-run
    - name: Run tests
      run: cargo test
    - name: Build the library without the command line
      run: cargo check --lib --no-default-features

  examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - name: Build release
      run: cargo build --release
    - name: Run Smoke test
      run: ./target/release/rays demo/ci-smoke-test.json
    - name: Run current work
      run: ./target/release/rays -p demo/demo.json
    - name: Run examples
      run: for f in demo/*.json; do ./target/release/rays --width 60 --height 40 $f; done

  gpu:
    # The GPU path tracer (--features gpu) on Mesa's software Vulkan driver, lavapipe.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - name: Check the committed shader matches its sources
      run: scripts/shader-sources.sh --check
    - name: Install lavapipe
      run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
    - name: Install Clippy
      run: rustup component add clippy
    - name: Run Clippy
      run: cargo clippy --features gpu -- -D errors
    - name: Build
      run: cargo build --release --features gpu
    - name: Run GPU tests
      run: "cargo test --release --features gpu gpu::"
    - name: Render on the GPU
      # spheres.json reaches the GPU; the smoke test scene falls back to the path tracer.
      run: cargo run --release --features gpu -- --gpu --width 60 --height 40 demo/benchmarks/spheres.json | tee /dev/stderr | grep -q "^- GPU:"

  web:
    # The browser version (web/): the library for wasm32, rendering through WebGPU in headless
    # Chromium (SwiftShader), compared with the native GPU renderer's image of the same scene.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - name: Check the library builds for wasm32
      run: rustup target add wasm32-unknown-unknown && cargo check --lib --no-default-features --features gpu --target wasm32-unknown-unknown
    - name: Install wasm-bindgen
      run: cargo install wasm-bindgen-cli --version "$(grep -A1 '^name = "wasm-bindgen"$' web/Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')"
    - name: Build the browser version
      run: scripts/build-web.sh
    - name: Install Chromium and lavapipe
      run: |
        cd web && npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
        sudo apt-get install -y mesa-vulkan-drivers
    - name: Render in the browser, and compare with the native GPU renderer
      run: |
        node web/test.mjs demo/benchmarks/spheres.json 160 90 32 web-spheres.png
        # Which of the two is off, when they differ: each against the CPU's wavefront stages
        # (other samples, so only a rough guide: some 0.05 of noise at 32 samples a pixel).
        cargo build --release --features gpu
        ./target/release/rays --wavefront --width 160 --height 90 --samples 32 -o cpu-spheres.png demo/benchmarks/spheres.json --compare web-spheres.png | grep -E "FLIP|Exposure" | sed 's/^/CPU against the browser: /'
        ./target/release/rays --gpu --width 160 --height 90 --samples 32 -o native-cpu.png demo/benchmarks/spheres.json --compare cpu-spheres.png | grep -E "GPU|FLIP|Exposure" | sed 's/^/the native GPU against the CPU: /'
        cargo run --release --features gpu -- --gpu --fresh --width 160 --height 90 --samples 32 -o native-spheres.png demo/benchmarks/spheres.json --compare web-spheres.png --max-flip 0.01
    - name: Keep the pictures
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: web-comparison
        path: |
          web-spheres.png
          native-spheres.png
          native-spheres.flip.png
          cpu-spheres.png
        if-no-files-found: ignore
