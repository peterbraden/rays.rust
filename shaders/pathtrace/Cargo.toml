[package]
name = "pathtrace"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["dylib", "lib"]

[dependencies]
spirv-std = "0.11"
# What the renderer computes too, written once (generic over the float).
shared = { path = "../shared" }

# On the CPU (the renderer uses this crate's buffer layouts and runs its code in tests), the
# structs are plain data for bytemuck, and glam's types are too.
[target.'cfg(not(target_arch = "spirv"))'.dependencies]
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.34", default-features = false, features = ["bytemuck", "std"] }

[features]
# Counters of the traversal's work, for the renderer's tests (`stats`).
stats = []
# Traversal by ray queries (`ray_query`), for devices with ray tracing hardware; the builder
# builds the shader with it as well as without.
ray_query = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_arch, values("spirv"))'] }
