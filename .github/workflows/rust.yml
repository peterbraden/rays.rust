name: Build, Tests, Lint and Examples

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: Install Clippy
      run: rustup component add clippy
    - name: Run Clippy
      run: cargo clippy -- -D errors
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Build the library without the command line
      run: cargo check --lib --no-default-features
    - name: Build the browser preview
      run: rustup target add wasm32-unknown-unknown && web/build.sh
    - name: Run Smoke test
      run: cargo run -- demo/ci-smoke-test.json
    - name: Run current work
      run: cargo run --release -- -p demo/demo.json
    - name: Run examples
      run: for f in demo/*.json; do cargo run --release -- --width 60 --height 40 $f; done

