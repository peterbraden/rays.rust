# The GPU path tracer's shaders, in Rust, compiled to SPIR-V by rust-gpu. A workspace of its
# own, on rust-gpu's pinned nightly (rust-toolchain.toml), so the renderer stays on stable:
# `scripts/build-shaders.sh` runs the builder, which writes `src/gpu/pathtrace.spv`.
[workspace]
members = ["pathtrace", "builder"]
resolver = "2"

[profile.release.build-override]
opt-level = 3
codegen-units = 16
