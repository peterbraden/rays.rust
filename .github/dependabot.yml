version: 2
updates:
  # The renderer's crates. The shaders' workspace (shaders/) is left out: its rust-gpu crates
  # are pinned to the nightly in shaders/rust-toolchain.toml and move together by hand.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
