<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rays scene builder</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="scene">
<header>
    <h1>Rays</h1>
    <nav id="pages" role="tablist" aria-label="Page">
        <button id="page-scene" type="button" role="tab" aria-selected="true" aria-controls="sidebar">Scene</button>
        <button id="page-render" type="button" role="tab" aria-selected="false" aria-controls="viewport">Render</button>
    </nav>
    <label class="for-scene">Scene
        <select id="scene-picker"></select>
    </label>
    <label class="for-render">Size
        <select id="preview-size">
            <option value="240">240</option>
            <option value="360" selected>360</option>
            <option value="480">480</option>
            <option value="720">720</option>
        </select>
    </label>
    <label class="for-render">Renderer
        <select id="renderer" title="The GPU renders scenes it can flatten (triangles, spheres, simple materials); the CPU renders everything">
            <option value="auto">GPU if it can</option>
            <option value="cpu">CPU</option>
        </select>
    </label>
    <button id="download" type="button" class="for-scene">Save scene</button>
    <button id="save-image" type="button" class="for-render">Save image</button>
    <button id="servers" type="button" class="for-render" title="Machines running &quot;rays serve&quot; that share the rendering">Servers…</button>
    <span id="status" role="status"></span>
</header>
<main>
    <section id="sidebar" aria-label="Scene">
        <div id="tabs" role="tablist" aria-label="Sidebar view">
            <button id="tab-outline" type="button" role="tab" aria-selected="true" aria-controls="outline-view">Outline</button>
            <button id="tab-json" type="button" role="tab" aria-selected="false" aria-controls="json-view">Scene file</button>
            <span id="json-state"></span>
        </div>
        <div id="outline-view" role="tabpanel" aria-labelledby="tab-outline">
        <div id="outline-column">
        <div class="panel-head">
            <h2>Scene</h2>
            <select id="add" aria-label="Add to the scene">
                <option value="">Add…</option>
            </select>
        </div>
        <ul id="outline"></ul>
        </div>
        <div id="inspector-column">
        <div class="panel-head">
            <h2 id="inspector-title">Properties</h2>
            <span>
                <button id="duplicate" type="button" hidden>Duplicate</button>
                <button id="delete" type="button" hidden>Delete</button>
            </span>
        </div>
        <form id="inspector" autocomplete="off"></form>
        </div>
        </div>
        <div id="json-view" role="tabpanel" aria-labelledby="tab-json" hidden>
            <textarea id="json" spellcheck="false" aria-label="Scene JSON"></textarea>
        </div>
    </section>
    <section id="viewport" aria-label="Render">
        <canvas id="canvas" width="360" height="240"></canvas>
        <p id="error" role="alert" hidden></p>
        <p id="hint">Drag to orbit · Shift-drag to pan · Scroll to zoom · Click an object to select it</p>
    </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
