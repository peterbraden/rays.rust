[package]
name = "builder"
version = "0.1.0"
edition = "2021"

[dependencies]
spirv-builder = "0.11"
# wgpu 30's naga (v30.0.2, from the submodule), with ray queries added to its SPIR-V reader
# and WGSL writer (vendor/naga-ray-query.patch, which scripts/build-shaders.sh applies).
naga = { path = "../../vendor/wgpu/naga", features = ["spv-in", "wgsl-in", "wgsl-out"] }
