[package]

name = "rays"
version = "0.0.1"
edition = "2024"

[workspace]
members = ["web/wasm"]

[features]
default = ["cli"]
# Everything only the command line needs: argument parsing, the progress bar, the terminal
# preview and reference comparison (nv-flip is C++). The library without it is the renderer
# alone, which also builds for WebAssembly (see web/).
cli = ["dep:clap", "dep:indicatif", "dep:console", "dep:termcolor", "dep:nv-flip", "dep:libc"]

[[bin]]
name = "rays"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# Only the formats used: PNG and EXR output, and common formats for heightmap images. The
# default set includes an AVIF encoder, which is large and does not run in a plain WebAssembly
# module.
image = { version = "0.25.5", default-features = false, features = ["png", "exr", "jpeg", "bmp", "tga", "tiff", "hdr"] }
nalgebra = "0.33.2"
rand = "0.6"
clap = { version = "4.5.32", features = ["derive"], optional = true }
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
lazy_static = "1.2.0"
rayon="1.0"
# Without its default hasher (ahash), which needs an operating system's random numbers and so
# does not build for WebAssembly.
tobj = { version = "4.0.3", default-features = false }
ordered-float = "5.0.0"
num-complex = "0.4.6"
rustfft = "6"
termcolor = { version = "1.0.5", optional = true }
indicatif = { version = "0.17.11", optional = true }
console = { version = "0.15.11", optional = true }
approx = "0.5.1"
nv-flip = { version = "0.1.2", optional = true }
ttf-parser = "0.25"
# Peak memory reporting on the command line.
libc = { version = "0.2", optional = true }

[profile.release]
# Whole-program optimisation: inlining across crates (nalgebra, rustfft, rand) and modules.
# Measured on an M2: ocean-boat 27.5 s -> 15.6 s, other scenes about 4% faster. Thin LTO, or
# one codegen unit without LTO, gave nothing. The cost is slower release rebuilds (about 65 s
# after touching one file, from about 20 s).
lto = "fat"
codegen-units = 1
