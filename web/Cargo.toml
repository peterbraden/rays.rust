[package]
name = "rays-web"
version = "0.0.1"
edition = "2024"
description = "Rays in a browser: the GPU path tracer through WebGPU"

# Its own workspace: built for wasm32 (scripts/build-web.sh), apart from the renderer's.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
rays = { path = "..", default-features = false, features = ["gpu"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde_json = "1.0"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
